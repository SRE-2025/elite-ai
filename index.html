<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.perplexity.ai https://api.x.ai https://api.mistral.ai https://api.deepseek.com https://openrouter.ai; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Elite AI</title>
<meta name="description" content="Every great AI, working together. Elite AI puts ChatGPT, Claude, Gemini, Grok and DeepSeek on one team and credits each for what it does best.">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elite AI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="shell">
  <aside class="drawer" aria-label="Conversations">
    <div class="drawer-head">
      <div class="brand"><img src="icons/icon.svg" alt="" width="26" height="26"><span>Elite <b>AI</b></span></div>
      <button class="btn sm gold" data-act="new-thread">+ New</button>
    </div>
    <nav id="thread-list" class="thread-list"></nav>
    <div class="drawer-foot">
      <button class="drawer-link" data-act="team">Meet the team</button>
      <button class="drawer-link" data-act="elite-index">Your Elite Index</button>
      <button class="drawer-link" data-act="audit">Champion audit</button>
      <button class="drawer-link" data-act="settings">Settings &amp; keys</button>
      <button class="drawer-link" data-act="feedback">Send feedback</button>
      <p class="muted small">Beta · Not affiliated with any AI company</p>
    </div>
  </aside>
  <div id="drawer-scrim" class="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="btn-threads" aria-label="Conversations">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand top-brand"><img src="icons/icon.svg" alt="" width="24" height="24"><span>Elite <b>AI</b></span></div>
      <div class="top-actions">
        <button class="btn sm gold" id="install-btn" hidden>Install</button>
        <button class="icon-btn" data-act="new-thread" aria-label="New conversation">
          <svg viewBox="0 0 24 24" width="21" height="21"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" aria-label="Settings and keys">
          <svg viewBox="0 0 24 24" width="21" height="21"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="modes" role="tablist" aria-label="How the AIs work together">
      <button role="tab" data-mode="team">Elite Team</button>
      <button role="tab" data-mode="compare">Compare</button>
      <button role="tab" data-mode="crosscheck">Cross-check</button>
      <button role="tab" data-mode="direct">Direct</button>
    </nav>
    <p id="mode-hint" class="mode-hint"></p>

    <main id="feed" class="feed"></main>

    <footer class="composer">
      <div class="team-row" id="team-row" aria-label="AIs on the team"></div>
      <form id="composer-form" class="composer-box">
        <textarea id="input" rows="1" enterkeyhint="send" placeholder="Give the team a task…" aria-label="Message"></textarea>
        <button type="submit" id="btn-send" class="send" aria-label="Send"></button>
      </form>
      <div class="composer-meta" id="composer-meta"></div>
    </footer>
  </div>
</div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
